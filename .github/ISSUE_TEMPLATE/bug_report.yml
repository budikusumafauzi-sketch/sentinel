name: 🐛 Bug Report
description: Report a reproducible defect, crash, or unexpected behavior in Sentinel
title: '[BUG]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in Sentinel! Please ensure this report is **not** a security vulnerability. For security vulnerabilities, consult our [Security Policy](../../SECURITY.md).
  - type: checkboxes
    id: security-check
    attributes:
      label: Security Confirmation
      options:
        - label: I confirm this is a standard software bug and does NOT disclose a sensitive security vulnerability or exploit.
          required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which area of Sentinel does this bug affect?
      options:
        - Mobile App (React Native / Expo / Android)
        - Desktop Agent (Rust Windows Agent)
        - Backend API (NestJS / Fastify)
        - Security Engine / Pure Rules (@sentinel/types)
        - Threat Intelligence Subsystem
        - AI Intelligence / Multimodal Analyzer
        - Documentation / Infrastructure
      default: 0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps are required to reproduce the behavior?
      placeholder: |
        1. Start backend with `pnpm --filter @sentinel/backend dev`
        2. Initiate deep scan on Android emulator
        3. Navigate to Scan tab
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Include relevant OS, Node, pnpm, and platform versions.
      placeholder: |
        - OS: Windows 11 / Android 14
        - Node Version: 22.x
        - pnpm Version: 11.25.0
        - Device / Emulator: Pixel 8a / API 34
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste relevant terminal logs or attach screenshots (ensure no secrets or personal credentials are included).
