name: ✨ Feature Request
description: Propose a new feature, platform enhancement, or capability for Sentinel
title: '[FEAT]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        We welcome ideas for improving Sentinel while upholding our core principles of **Deterministic Supremacy**, **Honest Provenance**, and **Privacy-Preserving Diagnostics**.
  - type: dropdown
    id: category
    attributes:
      label: Target Feature Area
      description: Where would this feature fit into the architecture?
      options:
        - Mobile Application & UI
        - Windows Desktop Agent
        - macOS / Linux Inspection (Future Roadmap)
        - Backend Core & Scans
        - Deterministic Security Rules
        - Threat Intelligence Sources
        - AI Advisory & Analysis
        - Developer Experience / Tooling
      default: 0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific limitation or user pain point?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: What alternative approaches or workarounds have you considered?
  - type: checkboxes
    id: architectural-alignment
    attributes:
      label: Architectural Tenet Check
      options:
        - label: This feature respects Deterministic Supremacy (does not rely on AI for mathematical security scoring).
        - label: This feature respects user privacy and data provenance boundaries.
