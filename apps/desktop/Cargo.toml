[package]
name = "sentinel-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Sentinel Team"]
description = "Sentinel Windows Desktop Security Agent"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "process", "signal"] }
winreg = "0.52"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
